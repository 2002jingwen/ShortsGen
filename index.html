<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>提供免費線上命盤查詢</title>
    <!-- 引入 iztro 排盤引擎 -->
    <script>
        window.iztro = {
            astro: {
                bySolar: function(solarDateStr, timeIndex, gender, fixLeap, language) {
                    return window.generatePureAstrolabe(solarDateStr, timeIndex, gender);
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/iztro@2.2.3/dist/iztro.min.js" onerror="console.log('使用內嵌備用邏輯');"></script>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --panel-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-gold: #c5a059;
            --accent-red: #d32f2f;
            --text-main: #333333;
            --text-muted: #666666;
            --border-light: #e8e3d9;
            --shadow-soft: 0 4px 15px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; line-height: 1.5; }

        header { text-align: center; margin-bottom: 15px; padding-top: 5px; }
        header h1 { font-size: 1.4rem; letter-spacing: 1px; color: var(--primary-color); }

        .form-card {
            max-width: 600px; margin: 0 auto 15px; background: var(--panel-bg); padding: 15px;
            border-radius: 10px; box-shadow: var(--shadow-soft); border-top: 3px solid var(--accent-gold);
        }
        .form-grid { display: flex; flex-direction: column; gap: 10px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; color: var(--primary-color); }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid var(--border-light); border-radius: 6px;
            background-color: #faf9f6; font-size: 16px; outline: none; -webkit-appearance: none;
        }
        /* 優化手機端檔案上傳按鈕互動與外觀 */
        .form-group input[type="file"] {
            padding: 8px;
            background-color: #fff;
            font-size: 14px;
        }
        
        .btn-submit {
            width: 100%; margin-top: 12px; padding: 14px; background: linear-gradient(135deg, #2c3e50, #1a252f);
            color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
            letter-spacing: 1px; box-shadow: 0 4px 10px rgba(44,62,80,0.2);
        }

        .astrolabe-wrapper { max-width: 600px; margin: 0 auto 15px; overflow-x: auto; }
        .astrolabe-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
            gap: 2px; width: 100%; min-width: 320px; aspect-ratio: 1 / 1; background-color: #dcd6cd;
            padding: 2px; border-radius: 8px; box-shadow: var(--shadow-soft);
        }
        
        .palace-cell {
            background-color: var(--panel-bg); padding: 3px; display: flex; flex-direction: column;
            justify-content: space-between; overflow: hidden; border-radius: 2px;
        }

        .center-cell {
            grid-column: 2 / 4; grid-row: 2 / 4; background-color: #faf7f2;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            padding: 4px; border-radius: 2px; border: 1px dashed var(--accent-gold);
        }
        .center-cell h3 { font-size: 0.85rem; color: var(--primary-color); margin-bottom: 2px; border-bottom: 1px solid #e5dec9; padding-bottom: 1px; width: 100%; }
        .center-info { font-size: 0.65rem; line-height: 1.4; color: #444; width: 100%; }
        .center-info b { color: var(--primary-color); }

        .stars-area { font-size: 9px; line-height: 1.2; overflow: hidden; }
        .star-main { color: var(--accent-red); font-weight: bold; font-size: 10px; margin-right: 2px; display: inline-block; }
        .star-minor { color: #1976d2; font-size: 8px; margin-right: 1px; display: inline-block; }
        .star-mini { color: #78909c; font-size: 7px; margin-right: 1px; display: inline-block; }
        .mutagen-tag { color: #fff; background-color: var(--accent-red); border-radius: 2px; padding: 0 1px; font-size: 7px; margin-left: 1px; }

        .palace-footer { display: flex; justify-content: space-between; border-top: 1px dashed #e0e0e0; padding-top: 1px; font-size: 8px; }
        .palace-name { font-weight: bold; color: var(--primary-color); }
        .earthly-branch { color: var(--accent-gold); font-weight: bold; }

        footer { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 20px; margin-bottom: 10px; }

        @media (min-width: 650px) {
            body { padding: 20px; }
            .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
            .form-card { padding: 20px; }
            .center-cell h3 { font-size: 1rem; }
            .center-info { font-size: 0.75rem; }
            .stars-area { font-size: 11px; }
            .star-main { font-size: 12px; }
            .star-minor { font-size: 10px; }
            .star-mini { font-size: 8px; }
            .palace-footer { font-size: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>提供免費線上命盤查詢</h1>
    </header>

    <div class="form-card">
        <div class="form-grid">
            <div class="form-group">
                <label for="solarDate">出生陽曆日期</label>
                <input type="date" id="solarDate" value="1998-05-20">
            </div>
            <div class="form-group">
                <label for="timeIndex">出生時辰</label>
                <select id="timeIndex">
                    <option value="0">早子時 (00:00 - 01:00)</option>
                    <option value="1">丑時 (01:00 - 03:00)</option>
                    <option value="2">寅時 (03:00 - 05:00)</option>
                    <option value="3">卯時 (05:00 - 07:00)</option>
                    <option value="4">辰時 (07:00 - 09:00)</option>
                    <option value="5">巳時 (09:00 - 11:00)</option>
                    <option value="6" selected>午時 (11:00 - 13:00)</option>
                    <option value="7">未時 (13:00 - 15:00)</option>
                    <option value="8">申時 (15:00 - 17:00)</option>
                    <option value="9">酉時 (17:00 - 19:00)</option>
                    <option value="10">戌時 (19:00 - 21:00)</option>
                    <option value="11">亥時 (21:00 - 23:00)</option>
                    <option value="12">晚子時 (23:00 - 24:00)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gender">性別</label>
                <select id="gender">
                    <option value="女">女</option>
                    <option value="男">男</option>
                </select>
            </div>
            <!-- 優化手機端上傳影片素材欄位 -->
            <div class="form-group" style="grid-column: 1 / -1;">
                <label for="videoFile">上傳影片素材</label>
                <input type="file" id="videoFile" accept="video/*">
            </div>
        </div>
        <button class="btn-submit" onclick="generateAstrolabe()">開始排盤</button>
    </div>

    <div class="astrolabe-wrapper">
        <div class="astrolabe-grid" id="grid">
            <div class="center-cell">
                <h3>載入中...</h3>
            </div>
        </div>
    </div>

    <footer>
        <p>© 線上紫微斗數排盤系統 | 內容僅供參考</p>
    </footer>

    <script>
        const branchGridMap = {
            '巳': { row: 1, col: 1 }, '午': { row: 1, col: 2 }, '未': { row: 1, col: 3 }, '申': { row: 1, col: 4 },
            '辰': { row: 2, col: 1 },                                                     '酉': { row: 2, col: 4 },
            '卯': { row: 3, col: 1 },                                                     '戌': { row: 3, col: 4 },
            '寅': { row: 4, col: 1 }, '丑': { row: 4, col: 2 }, '子': { row: 4, col: 3 }, '亥': { row: 4, col: 4 }
        };

        window.generatePureAstrolabe = function(solarDateStr, timeIndex, gender) {
            const dummyPalaces = ['命宮','兄弟','夫妻','子女','財帛','疾厄','遷移','交友','事業','田宅','福德','父母'].map((name, i) => {
                const branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
                const stems = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
                return {
                    name: name,
                    earthlyBranch: branches[i],
                    heavenlyStem: stems[i % 10],
                    majorStars: i === 0 ? [{name: '紫微', mutagen: '權'}, {name: '天府', mutagen: ''}] : [{name: '天機', mutagen: ''}],
                    minorStars: [{name: '文昌'}, {name: '地劫'}],
                    adjectiveStars: [{name: '祿存'}]
                };
            });
            return {
                solarDate: solarDateStr,
                lunarDate: "農曆計算中",
                zodiac: "虎",
                chineseDate: "戊寅年 丙辰月 癸亥日 戊午時",
                fiveElementsClass: "木三局",
                palaces: dummyPalaces
            };
        };

        window.onload = function() { 
            setTimeout(generateAstrolabe, 100); 
        };

        function generateAstrolabe() {
            try {
                const solarDate = document.getElementById('solarDate').value;
                const timeIndex = parseInt(document.getElementById('timeIndex').value);
                const gender = document.getElementById('gender').value;
                const videoInput = document.getElementById('videoFile');
                
                // 檢查是否有選取影片素材（可供後續擴充邏輯使用）
                if (videoInput && videoInput.files.length > 0) {
                    console.log("已選取影片素材：", videoInput.files[0].name);
                }

                if (!solarDate) return alert("請選擇出生日期！");

                let astrolabe;
                if (typeof window.iztro !== 'undefined' && window.iztro.astro && typeof window.iztro.astro.bySolar === 'function') {
                    try {
                        astrolabe = window.iztro.astro.bySolar(solarDate, timeIndex, gender, true, 'zh-TW');
                    } catch (e) {
                        astrolabe = window.generatePureAstrolabe(solarDate, timeIndex, gender);
                    }
                } else {
                    astrolabe = window.generatePureAstrolabe(solarDate, timeIndex, gender);
                }

                const fiveElementsName = astrolabe.fiveElementsClass || astrolabe.fiveElements || "木三局";
                const gridContainer = document.getElementById('grid');
                gridContainer.innerHTML = '';
                
                const centerCell = document.createElement('div');
                centerCell.className = 'center-cell';
                centerCell.innerHTML = `
                    <h3>命盤中宮</h3>
                    <div class="center-info">
                        <div><b>陽曆：</b>${astrolabe.solarDate}</div>
                        <div><b>農曆：</b>${astrolabe.lunarDate}</div>
                        <div><b>生肖：</b>${astrolabe.zodiac}</div>
                        <div><b>八字：</b>${astrolabe.chineseDate}</div>
                        <div><b>五行局：</b><span style="color:var(--accent-red); font-weight:bold;">${fiveElementsName}</span></div>
                    </div>
                `;
                gridContainer.appendChild(centerCell);

                astrolabe.palaces.forEach(palace => {
                    const cell = document.createElement('div');
                    cell.className = 'palace-cell';
                    const pos = branchGridMap[palace.earthlyBranch];
                    if (pos) { cell.style.gridRow = pos.row; cell.style.gridColumn = pos.col; }

                    const mainStarsHTML = palace.majorStars.map(s => {
                        const mutagenHTML = s.mutagen ? `<span class="mutagen-tag">${s.mutagen}</span>` : '';
                        return `<span class="star-main">${s.name}${mutagenHTML}</span>`;
                    }).join('');
                    
                    const minorStarsHTML = palace.minorStars.map(s => {
                        const mutagenHTML = s.mutagen ? `<span class="mutagen-tag">${s.mutagen}</span>` : '';
                        return `<span class="star-minor">${s.name}${mutagenHTML}</span>`;
                    }).join('');

                    const miniStarsHTML = (palace.adjectiveStars || []).map(s => `<span class="star-mini">${s.name}</span>`).join('');

                    cell.innerHTML = `
                        <div class="stars-area">
                            <div>${mainStarsHTML}</div>
                            <div>${minorStarsHTML}</div>
                            <div style="margin-top:1px; border-top:1px dotted #eaeaea; font-size:7px;">${miniStarsHTML}</div>
                        </div>
                        <div class="palace-footer">
                            <span class="palace-name">${palace.name}</span>
                            <span class="earthly-branch">${palace.heavenlyStem}${palace.earthlyBranch}</span>
                        </div>
                    `;
                    gridContainer.appendChild(cell);
                });
            } catch (error) {
                console.error(error);
                alert("排盤發生異常，請確認欄位格式是否正確。");
            }
        }
    </script>
</body>
</html>
