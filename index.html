<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 商品短影片剪輯 - 手機極速壓縮版</title>
    <!-- 載入免費商業使用 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Sans TC", sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #94a3b8; }
        input[type="text"], select, textarea { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 8px; font-size: 15px; background: #0f172a; color: #fff; }
        textarea { resize: vertical; min-height: 90px; }
        
        .upload-box { 
            border: 2px dashed #38bdf8; 
            padding: 25px; 
            text-align: center; 
            border-radius: 8px; 
            background: rgba(56, 189, 248, 0.05); 
            cursor: pointer; 
            color: #38bdf8; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn { display: block; width: 100%; background: #2563eb; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; text-align: center; text-decoration: none; }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #64748b; cursor: not-allowed; }
        .btn-download { background: #10b981; display: none; margin-top: 15px; }
        .btn-download:hover { background: #059669; }
        
        .preview-section { display: flex; flex-direction: column; align-items: center; margin-top: 25px; }
        
        /* 影片容器：標準 9:16 直式滿版 */
        .video-container { 
            width: 315px; 
            height: 560px; 
            background: #000; 
            border-radius: 12px 12px 0 0; 
            overflow: hidden; 
            position: relative; 
            border: 2px solid #334155; 
            border-bottom: none;
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: filter 0.3s ease;
        }

        .bg-blur { filter: blur(12px) brightness(0.85); }
        .bg-heavy-blur { filter: blur(22px) brightness(0.75); }
        .bg-mosaic { filter: blur(3px) contrast(1.5) brightness(0.8); }

        .fg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 80%);
        }

        .caption-overlay { 
            position: absolute; 
            bottom: 6%; 
            left: 6%; 
            right: 6%; 
            color: #fff; 
            padding: 14px; 
            border-radius: 12px; 
            text-align: center; 
            font-size: 16px; 
            font-weight: bold; 
            line-height: 1.4; 
            z-index: 10; 
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .controls-bar {
            width: 315px;
            background: #1e293b;
            padding: 12px;
            border-radius: 0 0 12px 12px;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .play-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .time-display {
            font-size: 13px;
            color: #38bdf8;
            font-family: monospace;
            white-space: nowrap;
        }
        .progress-container {
            flex-grow: 1;
            background: #334155;
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            border-radius: 3px;
        }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        @media (max-width: 600px) {
            .grid-3 { grid-template-columns: 1fr; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 商品短影片剪輯 (手機優化加強版)</h1>

    <div class="form-group">
        <label for="productName">1. 請輸入商品名稱：</label>
        <input type="text" id="productName" placeholder="例如：美白保濕精華液、自動咖啡機、降噪藍牙耳機">
    </div>

    <div class="grid-3">
        <div class="form-group">
            <label for="copyStyleSelect">2. 行銷文案風格：</label>
            <select id="copyStyleSelect" onchange="changeCopyStyle()">
                <option value="hot">熱銷搶購風</option>
                <option value="unboxing">質感開箱風</option>
                <option value="promo">優惠促銷風</option>
            </select>
        </div>
        <div class="form-group">
            <label for="bgStyleSelect">3. 背景去雜物：</label>
            <select id="bgStyleSelect" onchange="updateBgEffect()">
                <option value="bg-blur">自然柔霧 (推薦)</option>
                <option value="bg-heavy-blur">強效模糊</option>
                <option value="bg-mosaic">馬賽克質感</option>
            </select>
        </div>
        <div class="form-group">
            <label for="fontSelect">4. 免費商用字體：</label>
            <select id="fontSelect" onchange="changeFont()">
                <option value='"Noto Sans TC", sans-serif'>思源黑體 (標準)</option>
                <option value='"Noto Serif TC", serif'>思源宋體 (質感)</option>
                <option value='"Zen Maru Gothic", sans-serif'>粉圓體 (親和)</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="fileInput">5. 上傳產品素材：</label>
        <label class="upload-box" for="fileInput">
            <p id="uploadStatusText">📱 點擊選擇手機相簿內的影片或照片</p>
            <p style="font-size: 11px; color: #94a3b8; margin-top: 4px;">(系統會自動進行輕量化優化避免卡頓)</p>
        </label>
        <input type="file" id="fileInput" multiple accept="video/mp4,video/quicktime,video/*,image/*" style="display:none">
        <p id="fileCount" style="margin-top:8px; font-size:12px; color:#38bdf8; text-align:center;"></p>
    </div>

    <div id="copyEditGroup" class="form-group" style="display:none;">
        <label for="editableCopy">✏️ 自訂/修改行銷文案（換行即為下一句字幕）：</label>
        <textarea id="editableCopy"></textarea>
    </div>

    <button class="btn" id="generateBtn" onclick="startAutoGenerate()">✨ 生成短影片與播放預覽</button>
    <a id="downloadBtn" class="btn btn-download" download="marketing_video.webm">📥 下載生成的短影片 (.webm / .mp4)</a>

    <div class="preview-section">
        <div class="video-container" id="videoContainer">
            <img id="bgImg" class="bg-layer bg-blur" alt="霧化背景">
            <video id="bgVideo" class="bg-layer bg-blur" style="display:none;" muted playsinline webkit-playsinline loop></video>

            <img id="fgImg" class="fg-layer" alt="中央商品主體">
            <video id="fgVideo" class="fg-layer" style="display:none;" muted playsinline webkit-playsinline></video>
            
            <div id="captionOverlay" class="caption-overlay">請輸入商品名稱並上傳素材</div>
        </div>

        <div class="controls-bar">
            <button class="play-btn" id="playPauseBtn" onclick="togglePlayPause()">Pause</button>
            <div class="progress-container" onclick="seekVideo(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-display" id="timeDisplay">00:00 / 00:20</div>
        </div>
    </div>
</div>

<script>
    let filesList = [];
    let mediaUrls = [];
    let timer = null;
    let currentMediaIdx = 0;
    
    let isPlaying = false;
    let currentSecond = 0;
    const totalDuration = 20;
    const END_PROMO_TEXT = "短影音下單有優惠";

    function updateBgEffect() {
        const style = document.getElementById('bgStyleSelect').value;
        const bgImg = document.getElementById('bgImg');
        const bgVideo = document.getElementById('bgVideo');
        
        bgImg.className = `bg-layer ${style}`;
        bgVideo.className = `bg-layer ${style}`;
    }

    function changeFont() {
        const font = document.getElementById('fontSelect').value;
        document.getElementById('captionOverlay').style.fontFamily = font;
    }

    // 處理手機檔案載入與提示
    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const statusText = document.getElementById('uploadStatusText');
        const fileCountText = document.getElementById('fileCount');
        const generateBtn = document.getElementById('generateBtn');

        statusText.innerText = "⏳ 素材處理中，請稍候...";
        generateBtn.disabled = true;

        mediaUrls = [];
        filesList = files;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            fileCountText.innerText = `正在讀取第 ${i + 1}/${files.length} 個檔案...`;
            
            const isVid = file.type.startsWith('video/') || 
                          file.name.toLowerCase().endsWith('.mov') || 
                          file.name.toLowerCase().endsWith('.mp4') || 
                          file.name.toLowerCase().endsWith('.m4v');

            // 直接生成 ObjectURL 避免記憶體過載
            const blobUrl = URL.createObjectURL(file);
            mediaUrls.push({
                url: blobUrl,
                type: isVid ? 'video' : 'image'
            });
        }

        statusText.innerText = "✅ 素材載入成功！點擊可重新選擇";
        fileCountText.innerText = `已順利載入 ${files.length} 個素材檔案`;
        generateBtn.disabled = false;
    });

    function generateMarketingCopy(name, style) {
        const templates = {
            hot: `${name}最近在台灣真的超火\n專為在地生活打造CP值高到破表\n用過就真的回不去了趕快了解`,
            unboxing: `還在煩惱買不到好用的${name}嗎\n這款${name}質感超好效果直接拉滿\n親自實測推薦給你千萬別錯過`,
            promo: `大家許願很久的${name}終於補貨了\n品質幫大家嚴格把關買得更安心\n限時優惠活動中手慢就被搶光`
        };
        return templates[style] || templates.hot;
    }

    function changeCopyStyle() {
        const productName = document.getElementById('productName').value.trim() || "這款商品";
        const style = document.getElementById('copyStyleSelect').value;
        const editableCopy = document.getElementById('editableCopy');
        editableCopy.value = generateMarketingCopy(productName, style);
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = Math.floor(sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function togglePlayPause() {
        const btn = document.getElementById('playPauseBtn');
        const fgVideo = document.getElementById('fgVideo');
        const bgVideo = document.getElementById('bgVideo');

        if (isPlaying) {
            clearInterval(timer);
            isPlaying = false;
            btn.innerText = 'Play';
            fgVideo.pause();
            bgVideo.pause();
        } else {
            isPlaying = true;
            btn.innerText = 'Pause';
            fgVideo.play().catch(()=>{});
            bgVideo.play().catch(()=>{});
            timer = setInterval(runTick, 1000);
        }
    }

    function seekVideo(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const percentage = (e.clientX - rect.left) / rect.width;
        currentSecond = Math.floor(percentage * totalDuration);
        updateUI();
    }

    function renderMedia(media) {
        const bgImg = document.getElementById('bgImg');
        const bgVideo = document.getElementById('bgVideo');
        const fgImg = document.getElementById('fgImg');
        const fgVideo = document.getElementById('fgVideo');

        if (media.type === 'image') {
            bgVideo.style.display = 'none';
            fgVideo.style.display = 'none';
            bgImg.style.display = 'block';
            fgImg.style.display = 'block';
            
            bgImg.src = media.url;
            fgImg.src = media.url;
        } else {
            bgImg.style.display = 'none';
            fgImg.style.display = 'none';
            bgVideo.style.display = 'block';
            fgVideo.style.display = 'block';

            bgVideo.src = media.url;
            fgVideo.src = media.url;
            
            bgVideo.play().catch(()=>{});
            fgVideo.play().catch(()=>{});
        }
        updateBgEffect();
    }

    function runTick() {
        if (currentSecond >= totalDuration) {
            currentSecond = 0;
            document.getElementById('downloadBtn').style.display = 'block';
            document.getElementById('downloadBtn').href = mediaUrls[0].url;
        }
        updateUI();
        currentSecond++;
    }

    function getCombinedCaptions() {
        const editableCopy = document.getElementById('editableCopy');
        const userLines = editableCopy.value.split('\n').map(l => l.trim()).filter(l => l !== '');
        return [...userLines, END_PROMO_TEXT];
    }

    function updateUI() {
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const captionEl = document.getElementById('captionOverlay');

        progressFill.style.width = `${(currentSecond / totalDuration) * 100}%`;
        timeDisplay.innerText = `${formatTime(currentSecond)} / ${formatTime(totalDuration)}`;

        if (currentSecond % 6 === 0 && mediaUrls.length > 0) {
            currentMediaIdx = Math.floor(currentSecond / 6) % mediaUrls.length;
            renderMedia(mediaUrls[currentMediaIdx]);
        }

        const captions = getCombinedCaptions();
        if (captions.length > 0) {
            const step = Math.max(3, Math.floor(totalDuration / captions.length));
            if (currentSecond % step === 0) {
                const idx = Math.min(Math.floor(currentSecond / step), captions.length - 1);
                captionEl.innerText = captions[idx];
            }
        }
    }

    function startAutoGenerate() {
        const productName = document.getElementById('productName').value.trim();
        if (!productName) {
            alert('請輸入商品名稱！');
            return;
        }
        if (mediaUrls.length === 0) {
            alert('請至少上傳一個圖片或影片素材！');
            return;
        }

        const editGroup = document.getElementById('copyEditGroup');
        const editableCopy = document.getElementById('editableCopy');
        const style = document.getElementById('copyStyleSelect').value;

        if (editGroup.style.display === 'none' || !editableCopy.value.trim()) {
            editableCopy.value = generateMarketingCopy(productName, style);
            editGroup.style.display = 'block';
        }

        document.getElementById('downloadBtn').style.display = 'none';

        currentMediaIdx = 0;
        renderMedia(mediaUrls[0]);

        currentSecond = 0;
        if (timer) clearInterval(timer);
        isPlaying = true;
        document.getElementById('playPauseBtn').innerText = 'Pause';
        
        runTick();
        timer = setInterval(runTick, 1000);
    }
</script>

</body>
</html>
